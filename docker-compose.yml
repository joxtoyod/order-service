# Local development stack. Image versions must match production
# (see the deployment manifest for the running release).
services:
  api:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-local}
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
      - "5005:5005"   # JDWP debug port (enabled via JAVA_TOOL_OPTIONS in .env)
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${DB_NAME:-orders}
      POSTGRES_USER: ${DB_USER:-orders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orders}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7.2.5
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
