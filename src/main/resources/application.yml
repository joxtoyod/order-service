spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    commit: ${APP_COMMIT:unknown}
    environment: ${APP_ENV:local}

features:
  order-summary: ${FEATURE_ORDER_SUMMARY:false}

logging:
  level:
    root: INFO
    com.acme.orders: ${LOG_LEVEL:INFO}
